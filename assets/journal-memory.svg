 </defs><rect width="1200" height="650" fill="url(#paper)"/><rect width="1200" height="650" fill="url(#grain)"/><path d="M20 24H1180V626H20Z" fill="none" stroke="#6d4326" stroke-width="2" opacity=".45"/><path d="M34 38H1166V612H34Z" fill="none" stroke="#6d4326" stroke-width="1" opacity=".25"/><text x="48" y="70" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#28180f">The Campaign Journal</text><text x="49" y="98" font-family="Georgia,serif" font-size="14" letter-spacing="2" fill="#842c22">what the castle forgets, the page preserves</text><g filter="url(#shadow)" stroke="#28180f" stroke-width="4"><path d="M170 535V150q180-55 360 0v385q-180-55-360 0" fill="#f5e5c3"/><path d="M530 535V150q180-55 360 0v385q-180-55-360 0" fill="#f5e5c3"/><path d="M530 150v385"/><path d="M220 220h245M220 265h245M220 310h210M590 220h245M590 265h245M590 310h210" stroke="#6d4326" stroke-width="3"/><circle cx="845" cy="430" r="65" fill="#842c22"/><path d="M815 430h60M845 400v60" stroke="#e5c06d" stroke-width="7"/></g><path d="M275 390q80-85 160 0" fill="none" stroke="#842c22" stroke-width="6"/><g fill="#6d4326" font-family="Georgia,serif" font-style="italic" font-size="17"><text x="220" y="365">the oath I will keep</text><text x="590" y="365">a shield offered freely</text></g></svg>